- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.composer
    - ~/.config
    - ~/.config/karabiner
    - ~/intelephense
    - ~/code
    - ~/.vim/undo-history
    - ~/.agents
    - ~/.claude

- link:
    ~/.config/nvim: nvim
    ~/.config/ghostty: ghostty
    ~/Library/Application Support/lazygit/config.yml:
      path: lazygit/config.yml
      create: true
    ~/.composer/composer.json: composer/composer.json
    ~/.gitignore_global: git/gitignore_global
    ~/scripts: scripts
    ~/.tmux.conf: tmux/tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.gitconfig: git/gitconfig
    ~/.ssh/config: ssh/config
    ~/.config/phpactor: phpactor
    ~/.aerospace.toml: .aerospace.toml
    ~/.config/starship.toml : starship.toml
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
    ~/.agents/skills: agents/skills
    ~/.claude/skills: agents/skills
    ~/.claude/settings.json: claude/settings.json

- shell:
    - description: Install submodules
      command: "git submodule update --init --recursive"
    - description: Install TPM
      command: '[ -d "$HOME/.tmux/plugins/tpm" ] || git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"'
    - description: Install Oh My Zsh
      command: "zsh/install-omz.sh"
    - description: Install tmuxifier
      command: "zsh/install-tmuxifier.sh"
    - description: Installing ZSH plugins
      command: "zsh/zsh-plugins.sh"
    - description: Install MacOS Defaults
      command: "shell/macos/defaults.sh"

- brewfile:
    - Brewfile
